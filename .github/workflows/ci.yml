name: CI - GMAO Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python lint (flake8 + black)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install linters
        run: pip install flake8 black==22.3.0
      - name: flake8 (E9, F63, F7, F82 = erreurs critiques)
        run: |
          flake8 gmao_suite/ \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
      - name: flake8 (warnings non bloquants)
        continue-on-error: true
        run: |
          flake8 gmao_suite/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E203 \
            --statistics
      - name: black --check
        continue-on-error: true
        run: black --check --diff gmao_suite/

  validate-xml:
    name: Validation XML (parse + manifest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Validate all XML files
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          errors = 0
          for root, _, files in os.walk('gmao_suite'):
              for fn in files:
                  if fn.endswith('.xml'):
                      path = os.path.join(root, fn)
                      try: ET.parse(path)
                      except Exception as e:
                          print(f'XML ERROR {path}: {e}'); errors += 1
          if errors:
              print(f'\n{errors} XML errors found')
              sys.exit(1)
          print('All XML parse OK')
          PY
      - name: Validate __manifest__.py syntax
        run: python -c "import ast; ast.parse(open('gmao_suite/__manifest__.py').read())"

  module-install:
    name: Odoo install + tests (TransactionCase)
    runs-on: ubuntu-22.04
    # Image officielle Odoo 13 (Odoo + toutes les dependances reelles preinstallees)
    # -> install + tests REELS du module (pas de pip install Odoo flaky).
    container:
      image: odoo:13.0
      options: --user root
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install + test module (Odoo 13 officiel)
        run: |
          # Conteneur odoo:13.0 = shell sh (dash) : pas de 'set -o pipefail'.
          # On redirige vers un fichier et on capture le code retour.
          odoo -d gmao_test -i gmao_suite \
               --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE" \
               --db_host=postgres --db_user=odoo --db_password=odoo \
               --test-enable --stop-after-init --without-demo=all \
               --log-level=test > /tmp/odoo.log 2>&1
          rc=$?
          cat /tmp/odoo.log
          if [ "$rc" -ne 0 ]; then echo "::error::Odoo a quitte avec le code $rc"; exit "$rc"; fi
          if grep -E "odoo\.tests.*(FAIL|ERROR)|Failed to (load|initialize)|odoo\.modules\.loading.*ERROR" /tmp/odoo.log; then
            echo "::error::Des tests ont echoue ou l'install a plante"; exit 1
          fi
          echo "Install + tests OK"

  audit-links:
    name: Audit liens HTML (404 detection)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check sitemap.xml references real files
        run: |
          python - <<'PY'
          import re, os
          with open('sitemap.xml') as f: s = f.read()
          base = 'https://kouemousah.github.io/GMAO/'
          urls = re.findall(r'<loc>([^<]+)</loc>', s)
          missing = []
          for url in urls:
              rel = url.replace(base, '')
              if rel == '': rel = 'index.html'
              if not os.path.exists(rel):
                  missing.append(rel)
          if missing:
              print('Missing files referenced in sitemap:', missing)
              exit(1)
          print(f'{len(urls)} URLs in sitemap, all files exist')
          PY
